[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "academic-os-collector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0", "cryptography==46.0.5"]
[project.scripts]
academic-os-local = "academic_os.server:main"
[tool.setuptools.packages.find]
where = ["src"]
