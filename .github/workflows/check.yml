name: Verify synthetic system
on: [push, pull_request]
jobs:
  web-worker-collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: pip install -r collectors/local/requirements.lock
      - run: python scripts/validate_planning.py
      - run: python scripts/check_placeholders.py
      - run: python -m unittest discover -s collectors/local/tests -v
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:e2e
      - run: npm run test:pwa
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-28' 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew assembleDebug lint testDebugUnitTest --no-daemon
        working-directory: apps/android-companion
